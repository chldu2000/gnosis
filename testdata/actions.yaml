name: All actions
steps:
  - name: Open
    launch:
      app: com.example.mail
  - tap:
      locator:
        id: login
  - long_press:
      locator:
        text: Send
  - tap_at:
      x: -0.5
      y: 1.25
  - swipe:
      from_x: 0
      from_y: -1
      to_x: 2
      to_y: 0.5
  - type:
      text: hello
  - key:
      name: back
  - wait:
      duration: 1s
